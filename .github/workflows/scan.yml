name: HL Scanner
on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정으로 몇 분 지연될 수 있음)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼 활성화 (테스트용)
    inputs:
      test_routine:
        description: 'Claude 루틴 호출 테스트 (더미 텍스트 전송, signals.log에는 기록 안 함)'
        type: boolean
        default: false

permissions:
  contents: write            # signals.log 커밋용

concurrency:
  group: hl-scan             # 실행이 겹치면 순서대로 (signals.log 커밋 충돌 방지)
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scan.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: 신호 기록 커밋 (signals.log) + Claude 루틴 호출
        if: always()         # 스캔 실패 시에도 SCANNER_FAIL 기록은 커밋
        env:
          # 둘 다 미등록이면 루틴 호출 건너뜀 (URL: 루틴 편집 화면의 API 트리거 URL, TOKEN: 같은 화면에서 생성한 토큰)
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          TEST_ROUTINE: ${{ inputs.test_routine }}  # 수동 실행에서만 값 존재
        run: |
          # 이번 실행에서 새로 추가된 신호 줄 추출 (커밋 전에, SCANNER_FAIL 제외)
          if git ls-files --error-unmatch signals.log >/dev/null 2>&1; then
            NEW_SIGNALS=$(git diff --unified=0 -- signals.log | sed -n 's/^+\([^+].*\)/\1/p' | grep -v SCANNER_FAIL || true)
          else
            NEW_SIGNALS=$(grep -v '^#' signals.log 2>/dev/null | grep -v SCANNER_FAIL || true)
          fi
          # 루틴 호출 테스트 모드: 더미 텍스트를 전송 (signals.log·커밋에는 영향 없음)
          if [ "$TEST_ROUTINE" = "true" ]; then
            NEW_SIGNALS="[연동 테스트] 실제 신호 아님 — 이 문장이 보이면 워크플로→루틴 연결 성공. 브리핑 대신 수신 확인만 답할 것."
          fi
          if [ -n "$(git status --porcelain signals.log)" ]; then
            git config user.name "hl-scanner[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add signals.log
            git commit -m "신호 기록 $(date -u +%Y-%m-%dT%H:%M)Z"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          # 새 신호가 있으면 Claude 루틴(API 트리거 /fire 엔드포인트)에 신호 내용을 실어 호출
          # 형식: https://code.claude.com/docs/en/routines#trigger-a-routine
          if [ -n "$CLAUDE_ROUTINE_URL" ] && [ -n "$CLAUDE_ROUTINE_TOKEN" ] && [ -n "$NEW_SIGNALS" ]; then
            curl -sS -m 15 -X POST "$CLAUDE_ROUTINE_URL" \
              -H "Authorization: Bearer $CLAUDE_ROUTINE_TOKEN" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "anthropic-version: 2023-06-01" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg s "$NEW_SIGNALS" '{text: ("새 신호 발생 (알림시각/종목/방향/신호봉시각/RSI/현재가/손절/목표):\n" + $s)}')" \
              && echo "Claude 루틴 호출 완료" || echo "Claude 루틴 호출 실패 (알림은 ntfy로 이미 발송됨)"
          fi
