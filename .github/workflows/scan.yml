name: HL Scanner
on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정으로 몇 분 지연될 수 있음)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼 활성화 (테스트용)

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scan.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
